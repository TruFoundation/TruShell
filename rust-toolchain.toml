# What `cargo build` etc. use locally when nothing else is specified.
# This does NOT set the MSRV -- that's `rust-version` in Cargo.toml, which
# CI checks separately with an explicit `cargo +<msrv>`.
#
# Note that this file overrides whatever toolchain a CI step installs, so
# it must name a toolchain that actually builds the crate. It was pinned to
# 1.70.0, which cannot even read the committed Cargo.lock (lockfile v4
# needs cargo >= 1.78), so every CI job would have failed regardless of
# which toolchain the workflow asked for.
[toolchain]
channel = "stable"
components = ["rustfmt", "clippy"]
