name: CI

# What this checks, on every PR and every push to main (TS-004):
#   fmt         cargo fmt --check
#   clippy      cargo clippy --all-targets -D warnings   (Linux, macOS)
#   test        cargo test                               (Linux, macOS)
#   msrv        cargo +<rust-version from Cargo.toml> build --all-targets
#   acceptance  release build on PATH + packaging/acceptance_test.sh
#   audit       cargo audit (RustSec advisories)
#   deny        cargo deny check (licenses, bans, advisories, sources)
#   CI ok       aggregate; this is the one branch protection should require
#
# Windows is out of scope for now (see README).
#
# rust-toolchain.toml pins the default toolchain to stable and overrides
# whatever a setup step installs, so the MSRV job calls `cargo +<msrv>`
# explicitly rather than relying on the installed default.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: cargo test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo test --all-targets

  msrv:
    name: cargo build (MSRV)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Read rust-version from Cargo.toml
        id: read
        shell: bash
        run: |
          msrv=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/.*"([0-9.]+)".*/\1/')

          if [ -z "$msrv" ]; then
            echo "::error::rust-version is not set in Cargo.toml"
            exit 1
          fi

          echo "Using MSRV: $msrv"
          echo "msrv=$msrv" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.read.outputs.msrv }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-${{ steps.read.outputs.msrv }}

      # Explicit +toolchain: rust-toolchain.toml would otherwise win.
      - run: cargo +${{ steps.read.outputs.msrv }} build --all-targets

  acceptance:
    name: packaging acceptance smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release

      - name: Put trushell on PATH
        run: echo "$PWD/target/release" >> "$GITHUB_PATH"

      - name: Run packaging acceptance test
        run: bash packaging/acceptance_test.sh

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Brings Cargo.lock in line with Cargo.toml first, so the audit
      # covers every dependency and not just what the lockfile lists.
      - run: cargo fetch

      - run: cargo audit

  deny:
    name: cargo deny (licenses, bans, advisories, sources)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          log-level: warn
          command: check

  ci-ok:
    name: CI ok
    if: always()
    needs: [fmt, clippy, test, msrv, acceptance, audit, deny]
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        shell: bash
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || \
             [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ] || \
             [ "${{ contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "::error::one or more required CI jobs did not succeed"
            exit 1
          fi
