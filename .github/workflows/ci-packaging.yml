name: Package (deb/rpm)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build and test before packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release --all-targets
      - run: cargo test

  package-deb:
    name: Build .deb
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build .deb
        run: cargo deb

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: trushell-deb
          path: target/debian/*.deb
          if-no-files-found: error

  package-rpm:
    name: Build .rpm
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Install fpm
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential rpm
          sudo gem install --no-document fpm

      - name: Build .rpm
        run: |
          # Writes target/rpm/trushell_<version>_x86_64.rpm, which the
          # upload step below picks up.
          bash packaging/build_rpm.sh target/release/trushell

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: trushell-rpm
          path: target/rpm/*.rpm
          if-no-files-found: error

  # Checks that each package installs an executable trushell where PATH
  # will find it. It does not run packaging/acceptance_test.sh yet: that
  # script checks `trushell --version` and `trushell -c`, which do not
  # exist until TS-016. ci.yml's acceptance job tracks that on every PR;
  # once it passes, call the script here too (after each install step).
  acceptance:
    name: Package install check
    needs: [package-deb, package-rpm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install package testing tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cpio rpm

      - name: Download DEB artifact
        uses: actions/download-artifact@v4
        with:
          name: trushell-deb
          path: artifacts/deb

      - name: Download RPM artifact
        uses: actions/download-artifact@v4
        with:
          name: trushell-rpm
          path: artifacts/rpm

      - name: Install and check DEB
        shell: bash
        run: |
          sudo dpkg -i artifacts/deb/*.deb

          test -x /usr/bin/trushell
          [ "$(command -v trushell)" = /usr/bin/trushell ]

      - name: Extract and check RPM
        shell: bash
        run: |
          rm -rf artifacts/rpm/extracted
          mkdir -p artifacts/rpm/extracted

          rpm2cpio artifacts/rpm/*.rpm |
            (cd artifacts/rpm/extracted && cpio -idm)

          test -x artifacts/rpm/extracted/usr/local/bin/trushell
